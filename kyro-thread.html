<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b12">
  <title>Kyro Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b12;
      --panel: #14141f;
      --bubble: #1d1d2b;
      --mine: #6d4aff;
      --text: #f4f3fb;
      --dim: #9b9aab;
      --line: #2a2a38;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, sans-serif;
      background:
        radial-gradient(circle at 10% 0%, #24183d 0%, transparent 36%),
        linear-gradient(#0b0b12, #0b0b12);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: rgba(20,20,31,0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .back, .icon {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--line); background: var(--bubble);
      color: var(--text); cursor: pointer;
    }
    .ava {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #4c2d9b);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    }
    .ava img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .who { flex: 1; min-width: 0; }
    .who h1 { font-size: 16px; font-family: 'Space Grotesk', sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who p { font-size: 12px; color: #7ee0a5; }
    .thread {
      flex: 1; overflow-y: auto; padding: 18px 14px 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .empty { margin: auto; text-align: center; color: var(--dim); }
    .row { display: flex; }
    .row.mine { justify-content: flex-end; }
    .bubble {
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 16px;
      background: var(--bubble);
      font-size: 14px;
      line-height: 1.45;
    }
    .row.mine .bubble {
      background: linear-gradient(135deg, #7c5cff, #5634c9);
    }
    .time { font-size: 11px; color: var(--dim); margin-top: 4px; }
    .row.mine .time { color: rgba(255,255,255,.75); }
    .composer {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(20,20,31,0.95);
    }
    .composer input {
      flex: 1; border: 1px solid var(--line); background: var(--bubble);
      color: var(--text); border-radius: 22px; padding: 12px 16px; outline: none;
      font: inherit;
    }
    .send {
      width: 46px; height: 46px; border: 0; border-radius: 50%;
      background: #6d4aff; color: white; font-size: 18px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="top">
    <button class="back" onclick="window.location.href='kyro-app.html'">←</button>
    <div class="ava" id="ava">?</div>
    <div class="who">
      <h1 id="name">Chat</h1>
      <p id="sub">Kyro private chat</p>
    </div>
  </div>
  <div class="thread" id="thread"></div>
  <div class="composer">
    <input id="input" placeholder="Write a message" onkeydown="if(event.key==='Enter') send()">
    <button class="send" onclick="send()">➤</button>
  </div>
  <script>
    const API_BASE = 'https://chat-backend-tnii.onrender.com';
    const params = new URLSearchParams(location.search);
    const threadId = params.get('c');

    function currentUser() {
      try { return JSON.parse(localStorage.getItem('kyro_user') || 'null'); } catch (e) { return null; }
    }
    function userStorageKey(base) {
      const u = currentUser();
      const id = (u && (u.id || u._id || u.email)) || 'guest';
      return base + '_' + id;
    }
    function getToken() { return localStorage.getItem('kyro_token') || ''; }
    function initials(name) {
      if (!name) return '?';
      return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
    }
    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }
    function formatTime(date) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    if (!getToken() && !currentUser()) {
      location.href = 'kyro-chat.html';
    }

    let contacts = [];
    let groups = [];
    let chatThreads = {};
    let chatOrder = [];

    try { contacts = JSON.parse(localStorage.getItem(userStorageKey('kyro_contacts')) || '[]'); } catch (e) {}
    try { groups = JSON.parse(localStorage.getItem(userStorageKey('kyro_groups')) || '[]'); } catch (e) {}
    try { chatThreads = JSON.parse(localStorage.getItem(userStorageKey('kyro_threads')) || '{}'); } catch (e) {}
    try { chatOrder = JSON.parse(localStorage.getItem(userStorageKey('kyro_chatOrder')) || '[]'); } catch (e) {}

    function persist() {
      localStorage.setItem(userStorageKey('kyro_contacts'), JSON.stringify(contacts));
      localStorage.setItem(userStorageKey('kyro_groups'), JSON.stringify(groups));
      localStorage.setItem(userStorageKey('kyro_threads'), JSON.stringify(chatThreads));
      localStorage.setItem(userStorageKey('kyro_chatOrder'), JSON.stringify(chatOrder));
    }

    const contact = contacts.find(c => c.id === threadId) || groups.find(g => g.id === threadId);
    if (!threadId || !contact) {
      location.href = 'kyro-app.html';
    } else {
      document.getElementById('name').textContent = contact.name;
      document.getElementById('sub').textContent = contact.handle || 'On Kyro';
      document.getElementById('ava').innerHTML = contact.avatarDataUrl
        ? '<img src="' + contact.avatarDataUrl + '" alt="">'
        : initials(contact.name);
      if (!chatThreads[threadId]) chatThreads[threadId] = [];
      chatOrder = [threadId].concat(chatOrder.filter(id => id !== threadId));
      persist();
      render();
    }

    function render() {
      const box = document.getElementById('thread');
      const messages = chatThreads[threadId] || [];
      if (!messages.length) {
        box.innerHTML = '<div class="empty">No messages yet.<br>Say hello to ' + escapeHtml(contact.name) + '.</div>';
        return;
      }
      box.innerHTML = messages.map(m => `
        <div class="row ${m.own ? 'mine' : ''}">
          <div class="bubble">${escapeHtml(m.text)}<div class="time">${m.time || ''}</div></div>
        </div>
      `).join('');
      box.scrollTop = box.scrollHeight;
    }

    function send() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;
      chatThreads[threadId].push({
        id: 'm_' + Date.now(),
        text,
        time: formatTime(new Date()),
        own: true
      });
      input.value = '';
      persist();
      render();
    }
  </script>
</body>
</html>
