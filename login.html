<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Kyro Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { overflow: auto; }
    .auth {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .auth-card {
      width: min(420px, 100%);
      background: rgba(14,14,32,0.86);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 28px 24px;
      backdrop-filter: blur(16px);
    }
    .auth-card h1 {
      font-size: 32px;
      margin: 8px 0 6px;
    }
    .auth-card p { color: var(--muted); margin-bottom: 22px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 6px;
      color: #d5d9ee;
    }
    input {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: white;
      padding: 0 14px;
      margin-bottom: 14px;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: #7ee7ff;
      box-shadow: 0 0 0 3px rgba(60,231,255,0.15);
    }
    .back {
      display: inline-block;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .note {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }
    .note a { color: var(--cyan); font-weight: 600; }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <main class="auth">
    <form class="auth-card" action="#" method="post" onsubmit="event.preventDefault(); alert('Connect this form to your Node.js + MongoDB login route.');">
      <a class="back" href="index.html">← Back to welcome</a>
      <h1>Welcome back</h1>
      <p>Log in to continue your conversations.</p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button class="btn btn-primary" type="submit" style="width:100%">Login</button>
      <p class="note">New here? <a href="signup.html">Create account</a></p>
    </form>
  </main>
</body>
</html>
