<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — Kyro Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <main class="auth">
    <form class="auth-card" id="signupForm">
      <a class="back" href="index.html">← Back to welcome</a>
      <div class="steps" id="stepDots"></div>

      <section class="panel is-on" data-step="details">
        <h1>Create account</h1>
        <p>Join Kyro Chat in a few steps.</p>
        <label for="fullName">Full name</label>
        <input id="fullName" name="fullName" autocomplete="name" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="phone">Phone number</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+234..." required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        <label for="dob">Date of birth</label>
        <input id="dob" name="dob" type="date" required />
        <p class="age-line" id="ageLine">Age will appear here</p>
        <p class="form-error" id="detailsError"></p>
        <button class="btn btn-primary" type="submit" style="width:100%">Send OTP</button>
      </section>

      <section class="panel" data-step="otp">
        <h1>Check your inbox</h1>
        <p>We sent a code to <strong id="otpEmail"></strong></p>
        <label for="otp">OTP code</label>
        <input id="otp" name="otp" inputmode="numeric" maxlength="8" autocomplete="one-time-code" />
        <p class="form-error" id="otpError"></p>
        <button class="btn btn-primary" type="button" id="verifyBtn" style="width:100%">Verify code</button>
        <button class="btn btn-ghost" type="button" id="resendBtn" style="width:100%;margin-top:10px">Resend OTP</button>
      </section>

      <section class="panel" data-step="photo">
        <h1>Add a profile photo</h1>
        <p>This is how friends will recognize you.</p>
        <label class="avatar-pick">
          <input id="photo" type="file" accept="image/*" hidden />
          <span class="avatar-preview" id="avatarPreview">+</span>
          <span>Tap to upload</span>
        </label>
        <p class="form-error" id="photoError"></p>
        <button class="btn btn-primary" type="button" id="finishBtn" style="width:100%">Finish &amp; enter Kyro</button>
        <button class="btn btn-ghost" type="button" id="skipPhotoBtn" style="width:100%;margin-top:10px">Skip for now</button>
      </section>

      <p class="note">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>
  <script src="js/kyro.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
